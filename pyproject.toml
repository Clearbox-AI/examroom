[project]
name = "examroom"
version = "0.1.0"
description = "Define custom, domain-specific LLM benchmarks and track regressions across models and quantizations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
hf = ["torch", "transformers", "accelerate"]
anthropic = ["anthropic>=1"]
openai = ["openai"]
crc = ["pandas"]                  # suites/crc_pilot: tool_hard checkers execute pandas code in a subprocess
dev = ["pytest", "pandas"]

[project.scripts]
examroom = "examroom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["examroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
